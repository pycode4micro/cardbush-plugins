# Alternative direct MCP connection (do not add alongside the plugin: avoid duplicate tools).
# Install this package in the interpreter selected by command first.
[mcp_servers.seedream]
command = "python"
args = ["-m", "seedream_mcp"]
env_vars = ["ARK_API_KEY", "ARK_BASE_URL", "ARK_READ_USER_ENV", "SEEDREAM_MODEL", "SEEDREAM_OUTPUT_DIR", "SEEDREAM_TIMEOUT_SECONDS", "SEEDANCE_MODEL", "SEEDANCE_TIMEOUT_SECONDS", "MEDIAKIT_API_KEY", "MEDIAKIT_BASE_URL", "MEDIAKIT_TIMEOUT_SECONDS"]
startup_timeout_sec = 30
tool_timeout_sec = 360

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-editer"
version = "0.2.0"
description = "Standalone deterministic video editing tools for MCP agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "imageio-ffmpeg>=0.6,<0.7", "Pillow>=11,<13", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["numpy>=1.26"]

[project.scripts]
video-editer = "video_editer.mcp_server:main"

[tool.setuptools.packages.find]
include = ["video_editer*"]

[tool.setuptools.package-data]
video_editer = ["assets/*.png"]

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>衣服设计</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#1e211f);--panel:light-dark(#f6f7f4,#282d29);--line:light-dark(#d9ded6,#444d45);--text:light-dark(#20291f,#f3f6ed);--muted:light-dark(#566352,#c0c9bc);--accent:light-dark(#365b3b,#b8d7b0);--accent-ink:light-dark(#fff,#192619);font:14px/1.5 system-ui,sans-serif;color:var(--text)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select,textarea{font:inherit;color:inherit}button,select,input,textarea{border:1px solid var(--line);border-radius:9px;background:var(--bg)}button{cursor:pointer;padding:7px 11px;white-space:nowrap;min-height:34px}button:hover{background:var(--panel)}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}button.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input:not([type=checkbox]):not([type=color]),textarea,select{width:100%;padding:8px 10px}textarea{resize:vertical;min-height:100px}label{display:block;margin-bottom:5px;font-weight:600}small,.muted{color:var(--muted)}.app{padding:16px;max-width:1200px;margin:auto}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.heading{flex:1;min-width:140px}.heading h1{font-size:18px;margin:0}.badge{font-size:12px;border:1px solid var(--line);padding:2px 7px;border-radius:99px}.top select{width:auto;max-width:160px}.layout{display:grid;grid-template-columns:minmax(210px,1.35fr) minmax(220px,1fr);gap:16px}.board{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}.boardbar{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:10px}.viewtabs{display:flex;gap:6px}.canvas{height:440px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:9px;overflow:hidden}.canvas svg{height:100%;width:100%;display:block}.canvas g[data-part-id]{cursor:pointer}.canvas g.selected{filter:drop-shadow(0 0 3px #238cc9)}.board small{display:block;margin-top:8px}.details{display:flex;flex-direction:column;gap:12px;min-width:0}.row{display:flex;align-items:center;gap:8px}.row>*{min-width:0}.row .grow{flex:1}.detailbox{height:130px;border:1px solid var(--line);background:#fff;border-radius:9px;display:flex;justify-content:center;align-items:center;overflow:hidden}.detailbox svg{width:100%;height:100%}.field{margin:0}.color{display:flex;gap:10px;align-items:center}.color input{height:32px;width:48px;padding:2px}.lock{display:flex;gap:6px;align-items:center;font-weight:400;margin:0}.actions{display:flex;flex-wrap:wrap;gap:8px}.status{min-height:24px;margin:10px 0;color:var(--muted);overflow-wrap:anywhere}.status.error{color:light-dark(#a52822,#ffb4ad)}.instruction{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.instruction textarea{min-height:70px}.instruction .actions{justify-content:flex-end;margin-top:8px}.footer{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.footer p{margin:0;font-size:12px;color:var(--muted);max-width:380px}.results{margin-top:16px;display:grid;gap:8px}.job{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}.job .label{flex:1;min-width:140px}.findings{width:100%;margin:0;padding-left:20px}.findings li{margin-top:6px}.empty{text-align:center;padding:70px 12px}.hidden{display:none!important}details summary{cursor:pointer;color:var(--muted)}details .field{margin-top:10px}@media(max-width:600px){.app{padding:12px}.layout{grid-template-columns:1fr}.canvas{height:340px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px}.details .wide{grid-column:1/-1}.detailbox{height:100px}.top{gap:6px}.top h1{font-size:16px}.footer button{width:100%}}@media(max-width:350px){.details{display:flex}.canvas{height:280px}.top select{max-width:120px}}
</style></head><body>
<main class="app">
<div id="waiting" class="empty">正在打开衣服设计…</div>
<div id="workspace" class="hidden">
<header class="top"><div class="heading"><h1 id="title">衣服设计</h1><small id="subtitle">先画清楚，再看穿出来的效果</small></div><span class="badge" id="revision"></span><select id="history" aria-label="历史版本"></select><button id="refresh" title="重新读取最新设计">刷新</button></header>
<div class="layout">
<section class="board"><div class="boardbar"><div class="viewtabs"><button id="front" class="active">正面</button><button id="back">背面</button></div><button id="restore" class="hidden">恢复此版本</button></div><div class="canvas" id="canvas" role="group" aria-label="点击选择衣服部位"></div><small>点击部位修改细节，也可以直接描述你想怎么改。</small></section>
<section class="details">
<div class="field wide"><label for="parts">设计部位</label><select id="parts"></select></div>
<div class="detailbox wide" id="detail" aria-label="所选部位放大图"></div>
<div class="field wide"><label for="part-prompt">这个部位长什么样</label><textarea id="part-prompt" placeholder="例如：不对称翻领，左侧稍宽，边缘做细银色包边。"></textarea></div>
<div class="color"><label for="part-color">颜色</label><input type="color" id="part-color" value="#dce3d7"><span id="color-value"></span></div>
<label class="lock"><input type="checkbox" id="part-lock">锁定这个部位</label>
<details class="wide"><summary>必须保留的细节</summary><div class="field"><textarea id="requirements" placeholder="每行一项，例如：只保留左侧一个口袋"></textarea></div></details>
<div class="actions wide"><button id="save">保存部位</button><small id="saved-hint">语言描述由 AI 转成矢量修改；材质描述用于最终效果图。</small></div>
</section>
</div>
<section class="instruction"><label for="instruction">让 AI 帮你改设计</label><textarea id="instruction" placeholder="例如：把右袖改成披肩，保留左袖，领口加一圈不规则褶边。"></textarea><div class="actions"><button id="ask" class="primary">发送修改要求</button></div></section>
<div class="status" id="status" role="status" aria-live="polite"></div>
<footer class="footer"><p>矢量稿和部位描述会一起提交。生成后可以对照原设计检查，再继续修改。</p><button id="generate" class="primary">确认此版本，生成效果图</button></footer>
<section class="results" id="results" aria-label="效果图与分析"></section>
</div></main>
<script>/* APP_SCRIPT */</script></body></html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tencent-cos-upload"
version = "0.2.0"
description = "MCP upload, download, deletion and guarded rename for Tencent COS"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "cos-python-sdk-v5>=1.9.44,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
tencent-cos-upload = "cos_upload_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cos_upload_mcp = ["assets/icon.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
